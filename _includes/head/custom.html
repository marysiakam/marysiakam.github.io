<script>
// Open external links in a new tab
document.addEventListener('DOMContentLoaded', function(){
  var links = document.querySelectorAll('a[href^="http"]');
  links.forEach(function(a){
    try{
      var url = new URL(a.href);
      if (url.hostname !== location.hostname) {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
    } catch(e){}
  });
});
</script>

<script>
// Prefix primary nav links with a "$ " prompt, and mark the current page
document.addEventListener('DOMContentLoaded', function(){
  var navLinks = document.querySelectorAll('nav.greedy-nav .masthead__menu-item a');
  navLinks.forEach(function(a){
    try{
      var prompt = document.createElement('span');
      prompt.className = 'nav-prompt';
      prompt.setAttribute('aria-hidden', 'true');
      prompt.textContent = '$ ';
      a.insertBefore(prompt, a.firstChild);

      var path = a.getAttribute('href');
      if(!path) return;
      if(path.indexOf('/') === 0 && path.indexOf('?') === -1 && path.indexOf('#') === -1) {
        if(path !== '/' && path.slice(-1) !== '/') path = path + '/';
      }
      if (path === location.pathname) {
        a.classList.add('is-current');
      }
    } catch(e){}
  });
});
</script>
