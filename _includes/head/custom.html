<script>
// Open external links in a new tab
document.addEventListener('DOMContentLoaded', function(){
  var links = document.querySelectorAll('a[href^="http"]');
  links.forEach(function(a){
    try{
      var url = new URL(a.href);
      if (url.hostname !== location.hostname) {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      }
    } catch(e){}
  });
});
</script>

<script>
// Ensure the site-title text matches `site.title` from config
document.addEventListener('DOMContentLoaded', function(){
  var titleEl = document.querySelector('nav.greedy-nav .site-title');
  if (titleEl) {
    titleEl.textContent = "";
  }
});
</script>

<script>
// Add icons to primary nav links using Font Awesome
document.addEventListener('DOMContentLoaded', function(){
  var mapping = {
    '/': 'fas fa-home',
    '/experience/': 'fas fa-briefcase',
    '/projects/': 'fas fa-pencil-alt',
    '/musings/': 'fas fa-lightbulb',
    '/about/': 'fas fa-book'
  };

  var navLinks = document.querySelectorAll('nav.greedy-nav a:not(.site-title)');
  navLinks.forEach(function(a){
    try{
      var path = a.getAttribute('href');
      if(!path) return;
      // Normalize href (ensure trailing slash for site pages)
      if(path.indexOf('/') === 0 && path.indexOf('?') === -1 && path.indexOf('#') === -1) {
        if(path !== '/' && path.slice(-1) !== '/') path = path + '/';
      }
      var cls = mapping[path];
      if(cls) {
        var i = document.createElement('i');
        cls.split(' ').forEach(function(c){ i.classList.add(c); });
        i.setAttribute('aria-hidden', 'true');
        i.style.marginRight = '0.45rem';
        a.insertBefore(i, a.firstChild);
      }
    } catch(e){}
  });
});
</script>
